<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websocket Broadcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      #logs::-webkit-scrollbar {
        width: 6px;
      }
      #logs::-webkit-scrollbar-track {
        background: transparent;
      }
      #logs::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      #logs::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      .log-entry {
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl glass rounded-2xl shadow-xl overflow-hidden">
      <!-- Header -->
      <div class="bg-indigo-600 p-6 text-white">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="bg-indigo-500/50 p-2 rounded-lg">
              <i class="fas fa-tower-broadcast text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Websocket Broadcast</h1>
          </div>
          <div id="status-badge" class="flex items-center space-x-2 bg-indigo-700/50 px-3 py-1.5 rounded-full border border-indigo-400/30">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
            <span id="status-text" class="text-xs font-semibold uppercase tracking-wider">Disconnected</span>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="p-6 space-y-6">
        <form id="message-form" class="space-y-4">
          <div class="relative">
            <input
              type="text"
              id="message-input"
              class="w-full pl-4 pr-12 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 text-slate-700"
              placeholder="Type your message to broadcast..."
              required
            />
            <button 
              type="submit" 
              class="absolute right-2 top-2 p-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors"
              title="Send Message"
            >
              <i class="fas fa-paper-plane px-2"></i>
            </button>
          </div>
        </form>

        <div class="space-y-3">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest flex items-center">
              <i class="fas fa-terminal mr-2 text-indigo-500"></i>
              Live Stream Logs
            </h3>
            <span class="text-[10px] text-slate-400 font-mono">Real-time monitoring active</span>
          </div>
          <div 
            id="logs" 
            class="bg-slate-900 rounded-xl p-4 h-[350px] overflow-y-auto font-mono text-sm leading-relaxed"
          >
            <!-- Logs will appear here -->
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
        <p class="text-[11px] text-slate-400">© 2026 Websocket Broadcast Interface</p>
        <div class="flex space-x-4">
            <span class="flex items-center text-[11px] text-slate-400">
                <i class="fas fa-circle text-[6px] text-emerald-500 mr-1.5"></i>
                Service Up
            </span>
        </div>
      </div>
    </div>

    <script>
      const statusText = document.getElementById("status-text");
      const statusDot = document.getElementById("status-dot");
      const logsEl = document.getElementById("logs");
      const messageForm = document.getElementById("message-form");
      const messageInput = document.getElementById("message-input");

      // Set up the websocket
      const socket = new WebSocket("ws://localhost:8080");

      const appendLog = (type, message) => {
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        const entry = document.createElement('div');
        entry.className = 'log-entry mb-2 flex space-x-3';
        
        let labelColor = 'text-indigo-400';
        let icon = 'fa-info-circle';
        
        if (type === 'Sent') {
            labelColor = 'text-emerald-400';
            icon = 'fa-arrow-up';
        } else if (type === 'Received') {
            labelColor = 'text-amber-400';
            icon = 'fa-arrow-down';
        } else if (type === 'System') {
            labelColor = 'text-blue-400';
            icon = 'fa-gear';
        } else if (type === 'Error') {
            labelColor = 'text-red-400';
            icon = 'fa-triangle-exclamation';
        }

        entry.innerHTML = `
          <span class="text-slate-500 shrink-0 select-none">[${timestamp}]</span>
          <span class="${labelColor} font-bold shrink-0 min-w-[80px]">
            <i class="fas ${icon} mr-1.5 text-[10px]"></i>${type}:
          </span>
          <span class="text-slate-300 break-all">${message}</span>
        `;
        
        logsEl.appendChild(entry);
        logsEl.scrollTop = logsEl.scrollHeight;
      };

      socket.addEventListener("open", () => {
        statusText.textContent = "Connected";
        statusDot.classList.replace("bg-red-500", "bg-emerald-500");
        statusDot.classList.remove("animate-pulse");
        appendLog("System", "Websocket connection established");
      });

      socket.addEventListener("close", () => {
        statusText.textContent = "Disconnected";
        statusDot.classList.replace("bg-emerald-500", "bg-red-500");
        statusDot.classList.add("animate-pulse");
        appendLog("System", "Websocket connection closed");
      });

      socket.addEventListener("error", (error) => {
        statusText.textContent = "Connection Error";
        statusDot.classList.replace("bg-emerald-500", "bg-red-500");
        appendLog("Error", "Could not connect to the server");
      });

      socket.addEventListener("message", (event) => {
        appendLog("Received", event.data);
      });

      messageForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (message && socket.readyState === WebSocket.OPEN) {
          socket.send(message);
          appendLog("Sent", message);
          messageInput.value = "";
        } else if (socket.readyState !== WebSocket.OPEN) {
          appendLog("Error", "Message failed: Connection is not active");
        }
      });
    </script>
  </body>
</html>
